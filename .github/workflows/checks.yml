# The full tier of tools/check.sh, on main after work lands (docs/CHECKS.md). A branch lands on the fast
# tier (the static checks, the story and the phone's memory); this adds the clip, gl and touch checks, and
# gives every target (static, look, launch, story, walk, guide, mem, clip, gl, touch, astc; the story, the walk and the
# guide split in parts; the story by touch on a phone's page, storyp, and down its losing branches, storyl) its own
# runner, so that nobody waits for it. What it checks is
# what changed since the last run of it that passed, so a run that was skipped while another was going,
# or that failed, is made up by the next. A failure opens an issue labelled main-red (or adds to the open
# one) with the shards that failed and the commits they cover; the next pass closes it. A check that failed on
# one step and then on another when run again passes as FLAKY (tools/check.sh); those are added to the issue
# labelled check-flaky, so that an unsteady step shows by how often it is named. Only a commit this passes on is
# published (.github/workflows/pages.yml): a red main keeps the site on the last commit that passed.
name: Checks

on:
  push:
    # (main: the full tier after landing. Any other branch: its checks before landing, the fast tier tools/check.sh
    # routes for it, a runner a target, so that a session's machine does not play them two at a time; docs/CHECKS.md,
    # "Before landing, on the runners")
    branches: ['**', '!live', '!check-passes']
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets for tools/check.sh ("all", "story mem", "game"); empty: what changed since the last pass'
        default: ''

permissions:
  contents: read
  actions: read
  issues: write

# one run at a time on a branch; on main, while it goes, only the newest of the pushes behind it waits; on any other
# branch a newer push stops the run of the older one, whose result nobody waits for any more (its session asks for
# the newest commit's)
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PLAYWRIGHT: 1.63.0

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ inputs.targets }}
        run: |
          # (the story in three parts, each its own runner: a runner played the whole of it in 75 minutes, #51)
          export CHECK_SPLIT=1
          base=
          if [ -n "$TARGETS" ]; then plan=$(tools/check.sh --plan $TARGETS)
          elif [ "$GITHUB_REF" != refs/heads/main ]; then
            # A branch before landing: the fast tier, as a session's tools/check.sh routes it against main (its parts
            # already split, so no CHECK_SPLIT; but the guide's ways and the medium tier's budget, which the fast tier names
            # whole, split as main splits them, a runner a part: the guide's four ways in a row held a branch's run 492
            # past 72 minutes, against main's 23 for its slowest). After a pass of this branch, only what changed since it: that pass's
            # commit is the stamp tools/check.sh keeps in a clone, and with it a file that is main's as main has it
            # (main merged in) is left to main's own checks
            export CHECK_SPLIT=parts
            last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --branch "$GITHUB_REF_NAME" \
              --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            [ -n "$last" ] && git merge-base --is-ancestor "$last" HEAD 2>/dev/null && echo "$last" >"$(git rev-parse --git-dir)/oe-check-pass"
            plan=$(tools/check.sh --plan)
          else
            # the commit of this workflow's last pass on this branch (of a push: a run by hand of a few targets
            # passing is no pass of what changed before it)
            base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow checks.yml --branch "$GITHUB_REF_NAME" \
              --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty' || true)
            if [ -n "$base" ] && git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
              plan=$(CHECK_TIER=full CHECK_BASE=$base tools/check.sh --plan)
            else base=; plan=$(tools/check.sh --plan all); fi
          fi
          echo "$plan"
          echo "base=$base" >>"$GITHUB_OUTPUT"
          echo "shards=$(echo "$plan" | grep -E '^[a-z0-9:,-]+$' | jq -R . | jq -sc .)" >>"$GITHUB_OUTPUT"

  shard:
    needs: plan
    if: needs.plan.outputs.shards != '[]'
    # (Ubuntu 24.04's Mesa, 25.2, as a session's machine has it, where each check's waits were measured. ubuntu-latest
    # became 26.04 in November 2026, Mesa 26.0 with LLVM 21: there the desktop page's walk at night in the rain had not
    # set out in ten minutes, against two here, and the clip check's page lost its WebGL context in its first half
    # minute, run after run; issue 49)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          # (a branch's shard judges its check against main's passes, which needs main and the history between)
          fetch-depth: ${{ github.ref == 'refs/heads/main' && 1 || 0 }}
          filter: ${{ github.ref != 'refs/heads/main' && 'blob:none' || '' }}
      - name: Main's passes
        if: github.ref != 'refs/heads/main' && matrix.target != 'static'
        run: git fetch -q origin check-passes:refs/remotes/origin/check-passes || echo "no passes of main's to start from"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chromium as last time
        if: matrix.target != 'static'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.PLAYWRIGHT }}
      # (llvmpipe compiles a shader for the CPU it runs on, by the CPU's name, and files it under an id that records only
      # the CPU's family and its SSE, AVX and AVX-512 basics: two Intels of one family share the id, and code compiled
      # for the newer one may use instructions the older lacks. A runner loaded what a runner with another CPU had
      # compiled, and its GPU process died of an illegal instruction (SIGILL, exit code 132) at the first context: the
      # clip shard and the ride shard waited 13 and 15 minutes on a page with no WebGL, issue 84. So the shaders are
      # kept a CPU apiece, by its model and its flags)
      - name: Which CPU the runner has
        id: cpu
        if: matrix.target != 'static'
        run: |
          grep -m1 '^model name' /proc/cpuinfo || true
          echo "id=$(grep -m2 -E '^(model name|flags)' /proc/cpuinfo | sha1sum | cut -c1-12)" >>"$GITHUB_OUTPUT"
      # (Mesa keeps what llvmpipe compiled of each shader: on a session's machine the page came to its title in 60 s
      # with none kept and in 28 s with them; each shard keeps its own, the phone's tier's and the desktop's, and starts
      # from another shard's on the same CPU when it has none)
      - name: The shaders llvmpipe compiled last time
        if: matrix.target != 'static'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/mesa_shader_cache
            ~/.cache/mesa_shader_cache_db
          key: mesa-2404-${{ steps.cpu.outputs.id }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            mesa-2404-${{ steps.cpu.outputs.id }}-${{ matrix.target }}-
            mesa-2404-${{ steps.cpu.outputs.id }}-
      - name: Chromium, Xvfb and Mesa's software renderer
        if: matrix.target != 'static'
        run: |
          # (the runner's image lists Microsoft's package repository, which nothing here installs from; its index once came
          # back 403, "no longer signed", and apt's update stopped the shard before any check ran, run 468)
          { sudo grep -ls 'packages.microsoft.com' /etc/apt/sources.list.d/* || true; } | xargs -r sudo rm -f
          npm install -g "playwright@$PLAYWRIGHT"
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri
      # (a renderer that does not come up is asked again without the shaders kept from earlier runs, whatever kept them
      # wrong; SwiftShader is slow but plays, while a browser with no WebGL at all fails every check in it, so the shard
      # stops here, in seconds, and does not wait out a check's timeout)
      - name: Which renderer the browser gets
        if: matrix.target != 'static'
        run: |
          probe() { NODE_PATH=$(npm root -g) xvfb-run -a node tools/gl_renderer.js; }
          s=0; probe || s=$?
          [ "$s" -ne 0 ] || exit 0
          echo "the shaders kept from earlier runs dropped, and the renderer asked again"
          rm -rf ~/.cache/mesa_shader_cache ~/.cache/mesa_shader_cache_db
          s=0; probe || s=$?
          if [ "$s" -eq 2 ]; then echo "::error::The browser has no WebGL on this runner, with or without the shaders kept"; exit 1; fi
      - name: What the static checks import
        if: matrix.target == 'static'
        run: pip install numpy scipy shapely pyproj pillow mapbox-vector-tile   # (scipy: pipeline/street_ground.py --check; mapbox-vector-tile: pipeline/road_width.py --check)
      - name: What the BC7 and BC5 check imports
        if: matrix.target == 'astc'
        run: pip install numpy pillow   # (tools/bc_check.py)
      - name: Check
        env:
          TARGET: ${{ matrix.target }}
        run: |
          [ "$TARGET" = static ] || export CHECK_STATIC=0
          # (main's shards store their passes to share them; a branch's reads main's, which a store of its own would
          # shut out: tools/check_cache.py)
          [ "$GITHUB_REF" = refs/heads/main ] && export CHECK_STORE="$RUNNER_TEMP/passes"
          CHECK_JOBS=1 CHECK_OUT="$RUNNER_TEMP/check" tools/check.sh "$TARGET"
      # (a branch's shard's lines, for the result its session waits on: the job "result" below)
      - uses: actions/upload-artifact@v4
        if: always() && github.ref != 'refs/heads/main' && github.event_name == 'push'
        with:
          name: summary-${{ matrix.target }}
          path: ${{ runner.temp }}/check/summary.txt
          if-no-files-found: ignore
          retention-days: 3
      # (the shard's pass, as a session keeps its own: what the check read and which functions it ran, for the job below)
      - uses: actions/upload-artifact@v4
        if: success() && matrix.target != 'static' && github.event_name == 'push'
        with:
          name: passes-${{ strategy.job-index }}
          path: ${{ runner.temp }}/passes/*.json
          if-no-files-found: ignore
          retention-days: 1
      # (how long the play took and how many frames it ran: the same story played in 22 minutes on a session's
      # machine and in 75 on a runner, with llvmpipe on both)
      - name: What the browser took
        if: always() && matrix.target != 'static'
        run: grep -h 'played in\|^title\|GPU peak' "$RUNNER_TEMP"/check/*.log 2>/dev/null | cut -c1-200 || true
      # (each beat's frames by their own cost on a phone's tier, kept a month: issue 220 records the hitches a week before
      # they are held, tools/beat_hitch.py show)
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push' && startsWith(matrix.target, 'budget')
        with:
          name: hitch-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/check/*-hitch.jsonl
            ${{ runner.temp }}/check/budgetm*-budget.jsonl
          if-no-files-found: ignore
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: check-${{ strategy.job-index }}
          path: ${{ runner.temp }}/check
          retention-days: 7
      - id: flaky
        if: always()
        run: '[ ! -s "$RUNNER_TEMP/check/flaky.txt" ] || echo found=1 >>"$GITHUB_OUTPUT"'
      - uses: actions/upload-artifact@v4
        if: always() && steps.flaky.outputs.found
        with:
          name: flaky-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/check/flaky.txt
            ${{ runner.temp }}/check/*.log
          retention-days: 7

  # Main's passes, shared (docs/CHECKS.md): each shard that passed leaves what it read and the functions it ran, and
  # they are pushed, one small file a check, to the branch check-passes (one commit, replaced every time; the passes of
  # shards this run did not play stay as they were). A session's tools/check.sh fetches it and starts from main's
  # passes: it plays a check only where its own change reaches it. Nothing waits on this job and it cannot fail the run.
  passes:
    needs: [plan, shard]
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.shard.result != 'cancelled'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: passes-*
          path: passes-in
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls passes-in/*.json >/dev/null 2>&1 || { echo "no pass to share from this run"; exit 0; }
          python3 tools/check_cache.py pack passes-in
          mkdir shared
          if git fetch -q --depth 1 origin check-passes 2>/dev/null; then git archive FETCH_HEAD | tar -x -C shared; fi
          cp passes-in/*.json.gz shared/
          # (a branch Vercel sees pushed, with no vercel.json of its own: deployed, and failed, every run. Its own says
          # it is not a site: no deployment is made of it, docs/CHECKS.md "One deploy a pass")
          echo '{ "git": { "deploymentEnabled": false } }' > shared/vercel.json
          cd shared
          git init -q -b check-passes
          git add -A
          git -c user.name=Mira190 -c user.email=163523387+Mira190@users.noreply.github.com commit -q \
            -m "Main's passes at ${GITHUB_SHA:0:8}" -m "What each of main's checks read and ran at its last pass, for tools/check_cache.py (docs/CHECKS.md, Main's passes, shared)."
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" check-passes
          ls -la

  # A branch's result, where its session's tools/check.sh waits for it (docs/CHECKS.md, "Before landing, on the
  # runners"): every shard's lines and the verdict, one commit under the ref refs/checks/<commit checked>, which a
  # session fetches with git (no API, no token). Also when the run failed or found nothing to check.
  result:
    needs: [plan, shard]
    if: always() && github.ref != 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: summary-*
          path: summaries
      - env:
          GH_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.plan.result }}
          SHARD: ${{ needs.shard.result }}
          SHARDS: ${{ needs.plan.outputs.shards }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          mkdir out && cd out
          if [ "$PLAN" != success ]; then verdict=failure
          elif [ "$SHARD" = success ] || [ "$SHARD" = skipped ]; then verdict=success
          else verdict=$SHARD; fi
          {
            echo "result: $verdict"
            echo "run: $run"
            echo "targets: $(echo "$SHARDS" | jq -r 'join(" ")' 2>/dev/null)"
            for f in ../summaries/*/summary.txt; do [ -e "$f" ] && grep -v '^\.\.\. ' "$f"; done
            # (a shard that left no lines: cancelled, timed out, or its runner lost before the check began)
            for t in $(echo "$SHARDS" | jq -r '.[]' 2>/dev/null); do [ -e "../summaries/summary-$t/summary.txt" ] || echo "FAIL $t   (the shard left no result: see $run)"; done
          } >summary.txt
          [ "$verdict" = success ] && sed -i '/^FAIL .*left no result/d' summary.txt
          cat summary.txt
          git init -q
          git add summary.txt
          git -c user.name=Mira190 -c user.email=163523387+Mira190@users.noreply.github.com commit -q \
            -m "Checks of ${GITHUB_SHA:0:8}: $verdict" -m "$run"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" "HEAD:refs/checks/$GITHUB_SHA"

  report:
    needs: [plan, shard]
    if: always() && github.ref == 'refs/heads/main' && needs.shard.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flaky-*
          path: flaky
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.shard.result }}
          PLAN: ${{ needs.plan.result }}
          BASE: ${{ needs.plan.outputs.base }}
        run: |
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label main-red --state open --json number --jq '.[0].number // empty' || true)
          if [ "$RESULT" = failure ] || [ "$PLAN" = failure ]; then
            failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" --paginate \
              --jq '.jobs[] | select(.conclusion == "failure") | "- [\(.name)](\(.html_url))"')
            range="${BASE:+${BASE:0:8}...}${GITHUB_SHA:0:8}"
            {
              echo "The full checks failed on main at ${GITHUB_SHA:0:8} ([run]($run))."
              echo
              echo "$failed"
              echo
              if [ -n "$BASE" ]; then echo "Commits since the last pass: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$range"
              else echo "No earlier pass to compare with: every target was run."; fi
              echo
              echo "Each failed shard's logs and stills are in the run's artifacts. Run one here with \`tools/check.sh <shard's name>\`."
            } >body.md
            gh label create main-red --repo "$GITHUB_REPOSITORY" --color B60205 --description "The full checks fail on main" 2>/dev/null || true
            if [ -n "$open" ]; then gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body-file body.md
            else gh issue create --repo "$GITHUB_REPOSITORY" --label main-red --title "Main is red: the full checks fail" --body-file body.md; fi
          fi
          # the unsteady steps of this run, on the one issue that collects them: found by its title, not as the newest
          # issue labelled check-flaky, which is whichever cause was filed last (#198's tally went to #238, a canopy, once
          # #236 and #238 were filed for causes of their own, and read there as that cause's)
          if cat flaky/*/flaky.txt >flaky.txt 2>/dev/null && [ -s flaky.txt ]; then
            { echo "At ${GITHUB_SHA:0:8} ([run]($run), logs in its flaky artifacts):"; echo; sed 's/^FLAKY */- /' flaky.txt; } >flaky.md
            gh label create check-flaky --repo "$GITHUB_REPOSITORY" --color FBCA04 --description "Steps of the checks that fail one run and pass the next" 2>/dev/null || true
            n=$(gh issue list --repo "$GITHUB_REPOSITORY" --label check-flaky --state open --json number,title \
              --jq '[.[] | select(.title == "Checks: steps that fail one run and pass the next")][0].number // empty' || true)
            if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file flaky.md
            else gh issue create --repo "$GITHUB_REPOSITORY" --label check-flaky --title "Checks: steps that fail one run and pass the next" --body-file flaky.md; fi
          fi
          if [ "$RESULT" = failure ] || [ "$PLAN" = failure ]; then :
          elif [ "$RESULT" = success ] || [ "$RESULT" = skipped ]; then
            [ -z "$open" ] || gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "The full checks pass on main at ${GITHUB_SHA:0:8} ([run]($run))."
          fi
