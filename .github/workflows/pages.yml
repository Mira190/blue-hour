# Publishes web/ to GitHub Pages once the checks have passed on main (.github/workflows/checks.yml), with a
# version number, and moves the branch `live` to the commit published: Vercel's production deploys `live`
# (vercel.json; its project's production branch). A main the checks fail is not published, and the site keeps the
# last commit that passed; the next pass publishes. Run by hand (Actions, Deploy to Pages, Run workflow) it
# publishes main as it is, checked or not.
# The version is the major.minor in VERSION plus this workflow's run number (0.1.42), and
# web/version.json carries it with the commit and the build time for the page to show.
name: Deploy to Pages

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # (a pass of a push to main; a run of the checks by hand may have checked a few targets only)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Write the version
        id: version
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          version="$base.${{ github.run_number }}"
          # (tools/stamp.js, issue 116: version.json, and every address the page asks for given the hash of its
          # file, so that one page load is of one commit whatever a browser kept from the one before)
          node tools/stamp.js --commit "$SHA" --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat web/version.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Tag the release, and move live to it
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git tag "$tag" "$SHA"
          git push origin "$tag"
          # Vercel builds each move of live, and its plan allows so many deployments a day: live moves only where
          # what Vercel serves changed (docs/CHECKS.md, "One deploy a pass"). A pass of docs, tools or the pipeline's
          # data keeps Vercel on the commit before, which serves the same files; Pages and the tag take every pass.
          # (web/version.json is written above, in this checkout only: the diff is of the commits, not of it)
          was=
          if git fetch -q --depth 1 origin live 2>/dev/null; then was=$(git rev-parse FETCH_HEAD); fi
          if [ -n "$was" ] && git diff --quiet "$was" "$SHA" -- web vercel.json VERSION tools/vercel_build.sh tools/stamp.js; then
            echo "live stays at ${was:0:7}: nothing Vercel serves changed since it"
          else
            git push --force origin "$SHA:refs/heads/live"
          fi
