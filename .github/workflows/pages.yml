# Publishes web/ to GitHub Pages once the checks have passed on main (.github/workflows/checks.yml), with a
# version number, and moves the branch `live` to the commit published: Vercel's production deploys `live`
# (vercel.json; its project's production branch). A main the checks fail is not published, and the site keeps the
# last commit that passed; the next pass publishes. Run by hand (Actions, Deploy to Pages, Run workflow) it
# publishes main as it is, checked or not.
# The version is the major.minor in VERSION plus this workflow's run number (0.1.42), and
# web/version.json carries it with the commit and the build time for the page to show.
name: Deploy to Pages

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  actions: write   # (to read this run's artifacts, and to remove an earlier attempt's: below)
  id-token: write

jobs:
  deploy:
    # (a pass of a push to main; a run of the checks by hand may have checked a few targets only)
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    # (one deploy at a time, and one under way is never cancelled: the group was the workflow's, so every run of the checks
    # that ended, a cancelled one too, started a run of this one that skipped its job and still cancelled the deploy under
    # way, 24 November. On the job, a run whose job is skipped never joins it; a deploy takes a minute, so the next waits)
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Write the version
        id: version
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          version="$base.${{ github.run_number }}"
          # (tools/stamp.js, issue 116: version.json, and every address the page asks for given the hash of its
          # file, so that one page load is of one commit whatever a browser kept from the one before)
          node tools/stamp.js --commit "$SHA" --version "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat web/version.json

      - uses: actions/configure-pages@v5

      # (a re-run's earlier attempt left its artifact on the run, and deploy-pages refused two of the name: "Multiple
      # artifacts named github-pages", 24 November. The one this attempt uploads is the only one)
      - name: Remove an earlier attempt's artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.artifacts[].id' 2>/dev/null); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "removed artifact $id of an earlier attempt"
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      # (GitHub's list of a run's artifacts lags their upload: deploy-pages asked 0.4 s after the 108 MB was finalized,
      # found none, and failed, three times for 8bd427d3 on 24 November. Waited for until it lists it, 90 s at most)
      - name: Wait until the run lists its artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 0 30); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            if [ "${n:-0}" -ge 1 ]; then echo "listed after $((i * 3)) s"; exit 0; fi
            sleep 3
          done
          echo "::warning::the run does not list its github-pages artifact after 90 s; deploying all the same"

      # (and tried once more, half a minute on, where GitHub's side refused it)
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # (only where Pages took the deploy, at the first try or the second: on 25 November both were refused for 0e6c3fa9
      # and this step ran anyway, so Vercel served it while Pages stayed on the commit before for 45 minutes. The two
      # hosts move together; a deploy refused twice is run again whole, and a re-run finds its tag there already)
      - name: Tag the release, and move live to it
        if: ${{ !cancelled() && steps.version.outcome == 'success' && (steps.deployment.outcome == 'success' || steps.deployment2.outcome == 'success') }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          git tag "$tag" "$SHA" 2>/dev/null || echo "tag $tag is there already"
          git push origin "$tag" || echo "tag $tag was pushed already"
          # Vercel builds each move of live, and its plan allows so many deployments a day: live moves only where
          # what Vercel serves changed (docs/CHECKS.md, "One deploy a pass"). A pass of docs, tools or the pipeline's
          # data keeps Vercel on the commit before, which serves the same files; Pages and the tag take every pass.
          # (web/version.json is written above, in this checkout only: the diff is of the commits, not of it)
          was=
          if git fetch -q --depth 1 origin live 2>/dev/null; then was=$(git rev-parse FETCH_HEAD); fi
          if [ -n "$was" ] && git diff --quiet "$was" "$SHA" -- web vercel.json VERSION tools/vercel_build.sh tools/stamp.js; then
            echo "live stays at ${was:0:7}: nothing Vercel serves changed since it"
          else
            git push --force origin "$SHA:refs/heads/live"
          fi
